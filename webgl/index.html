  <script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.js"></script>
  <script>
    const {DeckGL, ScatterplotLayer, TextLayer, PathLayer, SimpleMeshLayer, OrthographicView, OrbitView, OrbitController, COORDINATE_SYSTEM} = deck;
    const IS_LOCAL_HOST = /^(localhost|127\.0\.0\.1)$/i.test(location.hostname);

    // Subclass that injects a per-vertex 'vtxColor' attribute (vec3, [0,1]) into the
    // SimpleMeshLayer vertex shader via the DECKGL_FILTER_COLOR hook.
    // Using a custom attribute name completely bypasses deck.gl's internal 'colors'
    // attribute routing (which ignores custom geometry buffers in 8.9.x).
    // The GPU then interpolates vtxColor linearly across each triangle — true smooth shading.
    class SmoothSphereSurfaceLayer extends SimpleMeshLayer {
      getShaders() {
        const shaders = super.getShaders();
        const inj = shaders.inject || {};
        return {
          ...shaders,
          inject: {
            ...inj,
            'vs:#decl':              (inj['vs:#decl']              || '') + '\nin vec3 vtxColor;',
            'vs:DECKGL_FILTER_COLOR': (inj['vs:DECKGL_FILTER_COLOR'] || '') + '\ncolor = vec4(vtxColor, color.a);',
          },
        };
      }
    }
    // Flat unit-circle disc mesh in the XY plane (Z=0).
    // SimpleMeshLayer rotates each instance via getTransformMatrix so Z aligns with the
    // outward sphere normal — the disc is then tangent to the sphere surface at the point.
    function buildDiscMesh(N = 16) {
      const pos = [0, 0, 0]; // centre vertex
      for (let k = 0; k < N; k++) { const a = k / N * Math.PI * 2; pos.push(Math.cos(a), Math.sin(a), 0); }
      const idx = [];
      for (let k = 0; k < N; k++) idx.push(0, k + 1, (k + 1) % N + 1);
      return {attributes: {POSITION: {value: new Float32Array(pos), size: 3}}, indices: {value: new Uint16Array(idx), size: 1}};
    }
    // Hollow ring mesh (annulus) — outer radius 1.0, inner radius innerR, in XY plane.
    function buildRingMesh(N = 32, innerR = 0.6) {
      const pos = [];
      for (let k = 0; k < N; k++) {
        const a = k / N * Math.PI * 2;
        pos.push(Math.cos(a) * innerR, Math.sin(a) * innerR, 0); // inner
        pos.push(Math.cos(a),          Math.sin(a),          0); // outer
      }
      const idx = [];
      for (let k = 0; k < N; k++) {
        const i0 = k*2, i1 = k*2+1, i2 = ((k+1)%N)*2, i3 = ((k+1)%N)*2+1;
        idx.push(i0,i1,i3, i0,i3,i2);
      }
      return {attributes: {POSITION: {value: new Float32Array(pos), size: 3}}, indices: {value: new Uint16Array(idx), size: 1}};
    }
    const DISC_MESH = buildDiscMesh(16);
    const RING_MESH = buildRingMesh(32, 0.6);

    const statusEl = document.getElementById('status');
    const tooltipEl = document.getElementById('tooltip');
    const sizeEl = document.getElementById('size');
    const sizevEl = document.getElementById('sizev');
    const labeledOnlyEl = document.getElementById('labeledOnly');
    const rankedModeEl = document.getElementById('rankedMode');
        const labelsOffBtn = document.getElementById('labelsOff');
        const labelsFewBtn = document.getElementById('labelsFew');
        const labelsAllBtn = document.getElementById('labelsAll');
    const contoursOnEl = document.getElementById('contoursOn');
    const surfaceOnEl  = document.getElementById('surfaceOn');
    const surfaceOnRow = document.getElementById('surfaceOnRow');
    const contourMetricEl = document.getElementById('contourMetric');
    const contourAlphaEl = document.getElementById('contourAlpha');
    const contourAlphavEl = document.getElementById('contourAlphav');
    const contourLegendEl = document.getElementById('contourLegend');
    const searchInputEl   = document.getElementById('searchInput');
    const searchBtnEl     = document.getElementById('searchBtn');
    const searchTypeEl    = document.getElementById('searchType');
    const searchResultEl         = document.getElementById('searchResult');
    const searchClustersPanelEl  = document.getElementById('searchClustersPanel');
    const clusterSortEl = document.getElementById('clusterSort');
    const clusterListEl = document.getElementById('clusterList');
    const labeledListEl = document.getElementById('labeledList');
    const viewMode2dBtn = document.getElementById('viewMode2d');
    const viewMode3dBtn = document.getElementById('viewMode3d');

    function clusterColor(cluster, alpha) {
      const h = (cluster * 137.508) % 360, s = 72, l = 52;
      const c = (1 - Math.abs(2*l/100 - 1)) * (s/100), x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l/100 - c/2;
      let r=0,g=0,b=0;
      if (h < 60) [r,g,b]=[c,x,0]; else if (h < 120) [r,g,b]=[x,c,0]; else if (h < 180) [r,g,b]=[0,c,x];
      else if (h < 240) [r,g,b]=[0,x,c]; else if (h < 300) [r,g,b]=[x,0,c]; else [r,g,b]=[c,0,x];
      return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255), alpha];
    }
    function showTooltip(x, y, html) { tooltipEl.style.display='block'; tooltipEl.style.left=(x+12)+'px'; tooltipEl.style.top=(y+12)+'px'; tooltipEl.innerHTML=html; }
    function hideTooltip() { tooltipEl.style.display='none'; }
    function fmt(v) { return Number(v).toFixed(1); }
    function inRangeOrUnknown(v, lo, hi, keepUnknown) { if (!Number.isFinite(v)) return keepUnknown; return v >= lo && v <= hi; }
    function lerpColor(c0, c1, t) {
      const k = Math.max(0, Math.min(1, Number(t)));
      return [Math.round(c0[0] + (c1[0] - c0[0]) * k), Math.round(c0[1] + (c1[1] - c0[1]) * k), Math.round(c0[2] + (c1[2] - c0[2]) * k)];
    }
    function starContourColor(level, alpha=255) {
      const l = Number(level);
      if (!Number.isFinite(l)) return [120, 170, 255, alpha];
      if (l < 2.0) { const c = lerpColor([66,152,255],[90,235,255], l/2.0); return [c[0],c[1],c[2],alpha]; }
      if (l < 2.7) { const c = lerpColor([90,235,255],[113,255,128], (l-2.0)/0.7); return [c[0],c[1],c[2],alpha]; }
      if (l < 4.0) { const c = lerpColor([113,255,128],[255,234,120], (l-2.7)/1.3); return [c[0],c[1],c[2],alpha]; }
      if (l < 5.3) { const c = lerpColor([255,234,120],[255,108,110], (l-4.0)/1.3); return [c[0],c[1],c[2],alpha]; }
      if (l < 6.5) { const c = lerpColor([255,108,110],[224,112,255], (l-5.3)/1.2); return [c[0],c[1],c[2],alpha]; }
      if (l < 8.0) { const c = lerpColor([224,112,255],[100,110,232], (l-6.5)/1.5); return [c[0],c[1],c[2],alpha]; }

          for (let fi = 0; fi < nFaces; fi++) {
            const face = faces[fi];
            if (!Array.isArray(face) || face.length < 3) continue;
            for (let vi = 0; vi < 3; vi++) {
              const vIdx = Number(face[vi]);
              const v    = verts[vIdx] || [0, 0, 0];
              const pb   = (fi * 3 + vi) * 3;
              positions[pb]   = Number(v[0]) * scale;
              positions[pb+1] = Number(v[1]) * scale;
              positions[pb+2] = Number(v[2]) * scale;
              const col = contourColor(key, vtxValues[vIdx], 255, colorMin, colorMax);
              vtxColor[pb]   = col[0] / 255;
              vtxColor[pb+1] = col[1] / 255;
              vtxColor[pb+2] = col[2] / 255;
            }
          }
          const mesh = {
            attributes: {
              POSITION: {value: positions, size: 3},
              vtxColor:  {value: vtxColor,  size: 3},
            },
            vertexCount: nFaces * 3,
          };
          sphereMeshCache.set(key, mesh);
          return mesh;
        }
        function refreshContourMetricOptions() {
          const setObj = currentContourSet();
          const order = ['star','density','length','ar','od','cs','hp','bpm'];
          const options = order.filter(m => setObj[m] && setObj[m].flatSegments && setObj[m].flatSegments.length > 0);
          if (!options.includes(contourMetric)) contourMetric = options[0] || 'star';
          contourMetricEl.innerHTML = options.length ? options.map(m => `<option value="${m}">${metricDisplayName(m)}</option>`).join('') : '<option value="star">STAR</option>';
          contourMetricEl.value = contourMetric;
        }

        let scheduleRender = () => {};
        createRangeSlider('starRange','starRangeV',0,15,0.1,(lo,hi)=>{starLo=lo; starHi=hi; if (isReady) scheduleRender();}, {openEndedMax:true});
        createRangeSlider('hpRange','hpRangeV',0,10,0.1,(lo,hi)=>{hpLo=lo; hpHi=hi; if (isReady) scheduleRender();});
        createRangeSlider('odRange','odRangeV',0,10,0.1,(lo,hi)=>{odLo=lo; odHi=hi; if (isReady) scheduleRender();});

        // ── Cluster tag helpers ────────────────────────────────────────────
        // Groups an array of point indices into [{cluster, count}] sorted by count desc.
        function groupByCluster(indices) {
          const m = new Map();
          for (const i of indices) { const c = Number(clusterArr[i]); m.set(c, (m.get(c) || 0) + 1); }
          return Array.from(m.entries()).sort((a, b) => b[1] - a[1]).map(([cluster, count]) => ({cluster, count}));
        }
        // Filters point indices to those matching the current rankedMode.
        function applyRankedFilter(indices) {
          if (rankedMode === 'ranked')   return indices.filter(i => rankedArr[i] === 1);
          if (rankedMode === 'unranked') return indices.filter(i => rankedArr[i] === 0);
          return indices;
        }
        // Clears all mapper/top-scores search state.
        function clearSearchState() {
          searchedMapIndices = [];
          searchClusterData = [];
          searchClusterSet = new Set();
          hoveredSearchCluster = null;
          searchMessage = '';
          showSearchResult(null);

        // Clears all selection and search state — used by Escape, empty search, etc.
        function clearAllState() {
          selectedMapSet.clear();
          selectedCluster = null;
          clearSearchState();
        }
        // Returns "genre1 / genre2 / non-genre" by parsing the pre-built display_name.
        function clusterTagSummary(c) {
          const d = clusterDetailsMap.get(Number(c));
          if (!d || !d.display_name) return null;
          // display_name: "c{N}: G1 / G2 | P1 / P2 | O1"
          const body = d.display_name.replace(/^c\d+:\s*/i, '');
          const secs  = body.split('|').map(s => s.trim());
          const genres = (secs[0] || '').split('/').map(s => s.trim()).filter(s => s && s !== '-');
          const others = (secs[2] || '').split('/').map(s => s.trim()).filter(s => s && s !== '-');
          const parts  = [...genres.slice(0, 2), ...others.slice(0, 1)].filter(Boolean);
          return parts.length ? parts.join(' / ') : null;
        }
        // Returns HTML for a tooltip listing the top-N most-frequent tags across
        // all labeled maps in the cluster (computed client-side from labeled_maps[].tags).
        const _topTagsTipCache = new Map();
        function clusterTopTagsTip(c, n) {
          n = n || 10;
          const key = `${c}:${n}`;
          if (_topTagsTipCache.has(key)) return _topTagsTipCache.get(key);
          const d = clusterDetailsMap.get(Number(c));
          if (!d || !Array.isArray(d.labeled_maps) || !d.labeled_maps.length) { _topTagsTipCache.set(key, null); return null; }
          const freq = new Map();
          for (const m of d.labeled_maps)
            for (const t of (Array.isArray(m.tags) ? m.tags : []))
              freq.set(t, (freq.get(t) || 0) + 1);
          const total  = d.labeled_maps.length;
          const sorted = Array.from(freq.entries()).sort((a, b) => b[1] - a[1]).slice(0, n);
          const lines  = sorted.map(([tag, cnt]) =>
            `<span style="color:#c8deff">${tag}</span> <span style="color:#5a7a9a">${cnt}/${total}</span>`
          ).join('<br/>');
          const result = `<b style="color:#d6e3fb">c${c} — top tags</b><br/>${lines}`;
          _topTagsTipCache.set(key, result);
          return result;
        }

        // Deviation cell: colour-codes a single metric value relative to the cluster mean.
        // t=0 at the mean (green), t=1 at ±1σ (red).
        function devCell(val, avgVal, stdVal, fmtFn, isTime) {
          if (!Number.isFinite(val)||!Number.isFinite(avgVal)) return '<td><span class="mdev neu">—</span></td>';
          const d = val - avgVal;
          const t = stdVal > 1e-6 ? Math.max(0, Math.min(1, Math.abs(d) / stdVal)) : (Math.abs(d) > 1e-6 ? 1 : 0);
          const r = Math.round(108 + (230 - 108) * t);
          const g = Math.round(205 + (106 - 205) * t);
          const b = Math.round(128 + (106 - 128) * t);
          const sign = d > 0 ? '+' : (d < 0 ? '−' : '');
          const str = isTime ? fmtMmSs(Math.abs(d)) : fmtFn(Math.abs(d));
          return `<td><span class="mdev" style="color:rgb(${r},${g},${b})">${sign}${str}</span></td>`;
        }

          const metrics = [

          const clrArr = clusterColorCached(c, 255);

          return `<div class="map-card">

              <button class="card-close-btn" data-desel-idx="${i}">✕</button>
            </div>
            ${creator ? `<div class="map-card-sub">by ${creator}${ranked ? ' · '+ranked : ''}</div>` : ''}
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px">
              <span style="font-size:11px;color:#4a6080">id ${mapId}</span>
              <span data-cluster-tip="${c}" style="font-size:11px;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,0.06);border-left:2px solid ${clrStr};font-family:Consolas,monospace;color:#b8d4ff;cursor:default">${tagSum ? `c${c} · ${tagSum}` : `c${c}`}</span>
            </div>
            <table style="width:100%;border-collapse:collapse;margin-bottom:6px">
              <thead><tr>
                <th style="text-align:left;font-size:10px;color:#3a5570;font-weight:normal;padding-bottom:2px"></th>
                <th style="text-align:left;font-size:10px;color:#3a5570;font-weight:normal;padding-bottom:2px">Map</th>
                <th style="text-align:left;font-size:10px;color:#3a5570;font-weight:normal;padding-bottom:2px">Cluster avg</th>
                <th style="text-align:left;font-size:10px;color:#3a5570;font-weight:normal;padding-bottom:2px">Δ</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <a href="https://osu.ppy.sh/beatmaps/${mapId}" target="_blank" rel="noopener" class="card-action-btn">Open in osu!</a>
          </div>`;
        }
        function buildCompactRow(i) {
          const mapId = mapIds[i];
          const hv = mapHover[i];
          let disp = Array.isArray(hv) ? String(hv[0]||'').trim() : '';
          if (!disp) disp = String(mapId||'');
          const c = Number(clusterArr[i]);
          const clrArr2 = clusterColorCached(c, 255);
          const clrStr2 = `rgb(${clrArr2[0]},${clrArr2[1]},${clrArr2[2]})`;
          const sr  = Number.isFinite(starArr[i])   ? Number(starArr[i]).toFixed(1)   : '—';
          const bpm = Number.isFinite(bpmArr[i])    ? Math.round(bpmArr[i])           : '—';
          const len = Number.isFinite(lengthArr[i]) ? fmtMmSs(lengthArr[i])           : '—';
          const tagSum2 = clusterTagSummary(c);
          return `<div class="map-row">
            <span class="map-row-title" title="${disp}">${disp}</span>
            <span class="map-row-cluster" data-cluster-tip="${c}" style="border-left:2px solid ${clrStr2};cursor:default">${tagSum2 ? `c${c} · ${tagSum2}` : `c${c}`}</span>

        function buildClusterCard(c) {
          const avg = clusterAvg.get(c) || {};

          const clrArr = clusterColorCached(c, 255);

            {n:'OD',     a:avg.od,     s:std.od,     f:v=>v.toFixed(1)},
            {n:'CS',     a:avg.cs,     s:std.cs,     f:v=>v.toFixed(1)},
            {n:'AR',     a:avg.ar,     s:std.ar,     f:v=>v.toFixed(1)},
            {n:'BPM',    a:avg.bpm,    s:std.bpm,    f:v=>Math.round(v)+''},

          const rows = metrics.map(m => {

            return `<tr>
              <td style="color:#5a7a9a;font-size:11px;padding:1px 5px 1px 0;white-space:nowrap">${m.n}</td>

                ${tagSum ? `c${c} · ${tagSum}` : `c${c}`}

              ${nm.toLocaleString()} maps · ${nl} labeled (${pct}%) · ${nr} ranked

            <table style="width:100%;border-collapse:collapse;margin-bottom:4px">
              <thead><tr>
                <th style="text-align:left;font-size:10px;color:#3a5570;font-weight:normal;padding-bottom:2px"></th>

        function renderSelectionPanel() {
          const el = document.getElementById('selectionPanel');
          const hasMapper  = searchedMapIndices.length > 0;
          const hasPinned  = selectedMapSet.size > 0;
          // Show a cluster card when a cluster is activated and nothing else is open.
          const hasClusterCard = selectedCluster !== null && !hasMapper && !hasPinned;
          if (!hasMapper && !hasPinned && !hasClusterCard) { el.style.display = 'none'; return; }
          el.style.display = 'block';

          let html = '';

          // ── Standalone cluster card (label / cluster-list click, no maps pinned) ──
          if (hasClusterCard) {
            html += buildClusterCard(Number(selectedCluster));
          }

          // ── Mapper / Top-Scores search section ───────────────────────
          if (hasMapper) {
            const MAX_ROWS = 300;
            const total = searchedMapIndices.length;
            // Sort by cluster ID, then descending star rating within each cluster.
            const sorted = searchedMapIndices.slice().sort((a, b) =>
              (clusterArr[a] - clusterArr[b]) || (starArr[b] - starArr[a])
            );
            const shown = sorted.slice(0, MAX_ROWS);
            // Build a human-readable label from searchMessage
            let sectionLabel;
            if (searchMessage.startsWith('mapper:')) {
              const name = searchMessage.slice(7).replace(/\(\d+\)$/, '').trim();
              sectionLabel = `By ${name} (${total.toLocaleString()})`;
            } else if (searchMessage.startsWith('top100:')) {
              const user = searchMessage.slice(7).replace(/\(\d+\)$/, '').trim();
              sectionLabel = `Top 100: ${user} (${total.toLocaleString()})`;
            } else {
              sectionLabel = `Search results (${total.toLocaleString()})`;
            }
            const rows = shown.map(i => buildCompactRow(i)).join('');
            const overflow = total > MAX_ROWS
              ? `<div style="text-align:center;padding:4px 0;font-size:10px;color:#5a7a9a">…and ${(total - MAX_ROWS).toLocaleString()} more</div>`
              : '';
            html += `<div class="sel-header">
              <span>${sectionLabel}</span>
              <button id="clearMapperBtn" class="card-close-btn" title="Clear search">✕</button>
            </div><div>${rows}${overflow}</div>`;
          }

          // ── Individually pinned maps section ───────────────────────────
          if (hasPinned) {
            const idxArr = [...selectedMapSet];
            const cards  = idxArr.map(i => buildMapCard(i)).join('');
            const hdr    = hasMapper ? 'Pinned' : 'Selected';
            html += `<div class="sel-header" style="${hasMapper ? 'margin-top:8px;' : ''}">
              <span>${hdr} (${idxArr.length})</span>
              <button id="clearSelBtn" class="card-close-btn" title="Clear all">✕</button>

          el.innerHTML = html;

          // Cluster card close button
          const closeClusterCardBtn = el.querySelector('.close-cluster-card-btn');

            closeClusterCardBtn.addEventListener('click', () => {
              selectedCluster = null;
              searchClusterSet = new Set();
              render(); renderClusterList(); renderSelectionPanel();

          // Clear mapper search button
          const clearMapperBtn = el.querySelector('#clearMapperBtn');
          if (clearMapperBtn) {
            clearMapperBtn.addEventListener('click', () => {
              clearSearchState();

              render(); renderClusterList(); renderSearchClustersPanel(); renderSelectionPanel();
            });

          // Clear pinned maps button
          const clearSelBtn = el.querySelector('#clearSelBtn');

            clearSelBtn.addEventListener('click', () => {
              selectedMapSet.clear();
              if (searchClusterData.length === 0) { searchClusterSet = new Set(); selectedCluster = null; }

          // Per-card deselect buttons (pinned maps only)

            btn.addEventListener('click', e => {
              e.stopPropagation();

                searchClusterSet = new Set(); selectedCluster = null;

              tooltipEl.style.top  = (ev.clientY + 14) + 'px';

            span.addEventListener('mouseleave', hideTooltip);
          });
        }
        function renderBadge() { renderSelectionPanel(); }
        function selectedDetail() {
          return selectedCluster === null ? null : (clusterDetailsMap.get(Number(selectedCluster)) || null);
        }
        function renderLabeledList() {
          if (selectedCluster === null) { labeledListEl.textContent = 'No cluster selected.'; return; }

          if (!d) { labeledListEl.textContent = `c${selectedCluster} — no labeled map data.`; return; }
          const rows = Array.isArray(d.labeled_maps) ? d.labeled_maps : [];
          if (!rows.length) { labeledListEl.textContent='Selected cluster has no labeled maps.'; return; }
          labeledListEl.innerHTML = rows.map(r => {
            const idx = lookupMapIndex(r.map_id);

        function renderClusterList() {
          const sortKey = String(clusterSortEl.value || 'cluster_id');

          if (sortKey === 'cluster_id') {
            rows.sort((a,b) => Number(a.cluster) - Number(b.cluster));

            // Sort by spread ascending: tightly packed clusters first.
            rows.sort((a,b) => (clusterSpread.get(Number(a.cluster))||0) - (clusterSpread.get(Number(b.cluster))||0));
          } else {
            rows.sort((a,b) => (Number(b[sortKey]||0)-Number(a[sortKey]||0)) || (Number(a.cluster)-Number(b.cluster)));
          }
          const showDensity = sortKey === 'density';
          clusterListEl.innerHTML = rows.map(r => {

            return `<button class="cluster-item ${selectedCluster!==null&&Number(r.cluster)===Number(selectedCluster)?'active':''}" data-cluster="${Number(r.cluster)}">c${Number(r.cluster)} | maps=${nm} labeled=${nl}/${nm} (${pct}%) ranked=${Number(r.n_ranked||0)}${densityExtra}</button>`;

        function fitViewState() {

          const coverageTxt = viewMode === '3d' ? ` | 3d_coords=${matched3dCount.toLocaleString()}/${n.toLocaleString()}` : '';
          statusEl.textContent = `view=${viewMode} | maps=${visible.length.toLocaleString()} / ${n.toLocaleString()}${coverageTxt} | labeled=${shownLabeled.toLocaleString()} / ${Number(meta.labeled_count||0).toLocaleString()} | contour_metric=${metricDisplayName(contourMetric)} | contours=${showContours?segmentData.length.toLocaleString():'off'}${sfx}${noticeTxt}`;
          // Only rebuild each DOM section when its inputs actually change.
          const _legendKey = `${contourMetric}|${contourAlpha}|${viewMode}|${showContours}|${showSurface}`;
          if (_legendKey !== _lastLegendKey) { _lastLegendKey = _legendKey; renderContourLegend(metricInfo); }
          const _badgeKey = `${selectedCluster}|${selectedMapSet.size}|${searchedMapIndices.length}|${searchClusterData.length}|${hoveredSearchCluster}`;
          if (_badgeKey !== _lastBadgeKey) { _lastBadgeKey = _badgeKey; renderBadge(); }
          if (selectedCluster !== _lastClusterListSelected) { _lastClusterListSelected = selectedCluster; renderClusterList(); }
          if (selectedCluster !== _lastLabeledListCluster) { _lastLabeledListCluster = selectedCluster; renderLabeledList(); }
        }

        let renderQueued = false;
        let lastRenderAt = 0;
        const MIN_RENDER_INTERVAL_MS = 90;
        scheduleRender = () => {
          if (!isReady || renderQueued) return;
          const now = performance.now();
          const wait = Math.max(0, MIN_RENDER_INTERVAL_MS - (now - lastRenderAt));
          renderQueued = true;
          setTimeout(() => {
            requestAnimationFrame(() => {
              renderQueued = false;
              lastRenderAt = performance.now();
              render();
            });
          }, wait);
        };
        sizeEl.addEventListener('input', () => { pointSize = parseFloat(sizeEl.value); sizevEl.textContent = pointSize.toFixed(1); scheduleRender(); });
        labeledOnlyEl.addEventListener('change', () => { labeledOnly = labeledOnlyEl.checked; render(); });
        rankedModeEl.addEventListener('change', () => { rankedMode = rankedModeEl.value; render(); });
        function setLabelsState(v) {
          showLabels = v;
          labelsOffBtn.classList.toggle('active', v === 0);
          labelsFewBtn.classList.toggle('active', v === 1);
          labelsAllBtn.classList.toggle('active', v === 2);
          render();
        }
        labelsOffBtn.addEventListener('click', () => setLabelsState(0));
        labelsFewBtn.addEventListener('click', () => setLabelsState(1));
        labelsAllBtn.addEventListener('click', () => setLabelsState(2));
        contoursOnEl.addEventListener('change', () => { showContours = contoursOnEl.checked; render(); });
        surfaceOnEl.addEventListener('change',  () => { showSurface  = surfaceOnEl.checked;  render(); });
        contourMetricEl.addEventListener('change', () => { contourMetric = String(contourMetricEl.value || 'star'); render(); });
        contourAlphaEl.addEventListener('input', () => { contourAlpha = Number(contourAlphaEl.value || 110); contourAlphavEl.textContent = String(contourAlpha); scheduleRender(); });
        const setViewMode = next => {
          if (next === '3d' && !has3d) {
            viewMode = '2d';
          } else {
            viewMode = (next === '3d' ? '3d' : '2d');
          }
          syncViewModePills();
          render();
        };
        viewMode2dBtn.addEventListener('click', () => setViewMode('2d'));
        viewMode3dBtn.addEventListener('click', () => setViewMode('3d'));
        function normalizeMapIdInput(s) {
          const t = String(s || '').trim().replace(/^\uFEFF/, '').replace(/^["']|["']$/g, '');
          if (t.endsWith('.0')) return t.slice(0, -2);
          if (/^\d+$/.test(t)) return t;
          const f = Number(t);
          if (Number.isFinite(f) && Number.isInteger(f)) return String(f);
          return t;
        }
        // map_id → first point index
        const mapIdToIndex = new Map();
        for (let i = 0; i < n; i++) {
          const mid = normalizeMapIdInput(mapIds[i]);
          if (!mapIdToIndex.has(mid)) mapIdToIndex.set(mid, i);
        }
        function lookupMapIndex(id) { return mapIdToIndex.get(normalizeMapIdInput(String(id))); }
        function clusterPct(nm, nl) { return nm > 0 ? (nl / nm * 100).toFixed(1) : '0.0'; }
        // lowercase creator name → array of point indices (populated by background fetch)
        const creatorToIndices = new Map();
        fetch('./data/map_hover.json')
          .then(r => r.json())
          .then(data => {
            mapHover = data;
            for (let i = 0; i < n; i++) {
              const hv = mapHover[i];
              const creator = (Array.isArray(hv) ? String(hv[1] || '') : '').trim().toLowerCase();
              if (!creator) continue;
              if (!creatorToIndices.has(creator)) creatorToIndices.set(creator, []);
              creatorToIndices.get(creator).push(i);
            }
            mapHoverReady = true;
          })
          .catch(() => { mapHoverReady = true; });
        function showSearchResult(html) {
          if (html) { searchResultEl.innerHTML = html; searchResultEl.style.display = ''; }
          else { searchResultEl.style.display = 'none'; searchResultEl.innerHTML = ''; }
        }
        function runSearch() {
          const raw = String(searchInputEl.value || '').trim();
          const mode = String(searchTypeEl.value || 'map_id');
          if (!raw) {
            clearAllState();
            render(); renderSearchClustersPanel(); renderSelectionPanel();
            return;
          }
          if (mode === 'map_id') {
            searchClusterData = []; searchClusterSet = new Set();
            hoveredSearchCluster = null;
            const q = normalizeMapIdInput(raw);
            const idx = mapIdToIndex.get(q);
            if (Number.isInteger(idx)) {
              selectedMapSet.add(idx);
              searchedMapIndices = [];
              selectedCluster = Number(clusterArr[idx]);
              searchClusterSet = new Set([...selectedMapSet].map(i => Number(clusterArr[i])));
              if (searchClusterSet.size === 1) selectedCluster = [...searchClusterSet][0];
              searchClusterData = []; hoveredSearchCluster = null;
              searchMessage = `found:${q}`;
              const hv = mapHover[idx];
              const title = Array.isArray(hv) ? String(hv[0] || q) : q;
              const creator = Array.isArray(hv) ? String(hv[1] || '') : '';
              showSearchResult(`<b>${title}</b>${creator ? ` · by ${creator}` : ''} · cluster <b>c${clusterArr[idx]}</b>`);
            } else {
              searchedMapIndices = [];
              searchMessage = `not-found:${q}`;
              showSearchResult(`No map found for ID <b>${q}</b>`);
            }
          } else if (mode === 'top_scores') {
            // ── Top Scores search (requires local proxy) ──────────────────
            hoveredSearchCluster = null;
            showSearchResult('Fetching top 100…');
            fetch(`${TOP_SCORES_PROXY}/?action=top100&user=${encodeURIComponent(raw)}`)
              .then(r => r.json())
              .then(data => {
                if (data.error) throw new Error(data.error);
                const resultMapIds = data.map_ids || [];
                const allIdx = resultMapIds
                  .map(mid => lookupMapIndex(mid))
                  .filter(Number.isInteger);
                const filtered = applyRankedFilter(allIdx);
                searchedMapIndices = filtered;
                searchClusterData = groupByCluster(filtered);
                searchClusterSet = new Set(searchClusterData.map(d => d.cluster));
                selectedCluster = null;
                searchMessage = `top100:${raw}(${filtered.length})`;
                const statusNote = rankedMode !== 'all' ? ` (${rankedMode} only)` : '';
                showSearchResult(
                  `<b>${raw}</b>${statusNote} top 100 · ` +
                  `<b>${allIdx.length}</b> in dataset · ` +
                  `<b>${filtered.length}</b> visible · ` +
                  `<b>${searchClusterData.length}</b> clusters`
                );
                render(); renderSearchClustersPanel(); renderSelectionPanel();
              })
              .catch(err => {
                clearSearchState();
                showSearchResult(
                  `Top scores error: ${String(err).replace(/^Error:\s*/, '')}` +
                  ` — is <code>top_scores_proxy.py</code> running?`
                );
                render(); renderSearchClustersPanel(); renderSelectionPanel();
              });
            return; // async — don't fall through to the synchronous render below

          } else {
            hoveredSearchCluster = null;
            if (!mapHoverReady) {
              showSearchResult('Map metadata still loading — please try again in a moment.');
              render();
              return;
            }
            // Mapper search — case-insensitive, also try partial match if exact fails
            const q = raw.toLowerCase();
            let indices = creatorToIndices.get(q) || null;
            let matchedName = raw;
            if (!indices) {
              // partial: find all keys containing the query
              const partials = [];
              for (const [k, v] of creatorToIndices) { if (k.includes(q)) partials.push([k, v]); }
              if (partials.length === 1) { matchedName = partials[0][0]; indices = partials[0][1]; }
              else if (partials.length > 1) {
                // ambiguous — show suggestions instead of highlighting
                searchedMapIndices = [];
                searchMessage = `mapper-ambiguous`;
                const names = partials.slice(0, 6).map(p => `<b>${p[0]}</b> (${p[1].length})`).join(', ');
                showSearchResult(`Ambiguous — did you mean: ${names}${partials.length > 6 ? ` +${partials.length - 6} more` : ''}?`);
                render();
                return;
              }
            }
            if (!indices || indices.length === 0) {
              searchedMapIndices = [];
              searchClusterData = []; searchClusterSet = new Set();
              searchMessage = `mapper-not-found:${q}`;
              showSearchResult(`No maps found for mapper <b>${raw}</b>`);
            } else {
              // Filter to the active ranked mode so highlighted maps match visible ones
              const filtered = applyRankedFilter(indices);
              const statusNote = rankedMode !== 'all' ? ` (${rankedMode} only)` : '';
              searchedMapIndices = filtered;
              searchClusterData = groupByCluster(filtered);
              searchClusterSet = new Set(searchClusterData.map(d => d.cluster));
              // Don't auto-select a single cluster — sidebar handles navigation
              selectedCluster = null;
              searchMessage = `mapper:${matchedName}(${filtered.length})`;
              const totalMaps = filtered.length;
              const nClusters = searchClusterData.length;
              showSearchResult(`<b>${matchedName}</b>${statusNote} · <b>${totalMaps}</b> maps across <b>${nClusters}</b> clusters`);
            }
          }
          render();
          renderSearchClustersPanel();
          renderSelectionPanel();
        }
        function renderSearchClustersPanel() {
          if (!searchClusterData.length) {
            searchClustersPanelEl.style.display = 'none';
            return;
          }
          searchClustersPanelEl.style.display = 'block';
          const collapsed = searchClustersPanelEl.dataset.collapsed === '1';
          const hdr = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${collapsed?0:5}px">
            <span style="font-size:11px;font-weight:700;color:#d6e3fb">Clusters (${searchClusterData.length})</span>
            <button id="scCollapseBtn" style="background:none;border:0;color:#9db0d1;cursor:pointer;font-size:13px;line-height:1;padding:0 2px">${collapsed?'▸':'▾'}</button>
          </div>`;
          const rows = collapsed ? '' : searchClusterData.map(({cluster, count}) => {
            const active = selectedCluster !== null && Number(selectedCluster) === cluster;
            return `<div class="sc-item${active?' sc-active':''}" data-cluster="${cluster}">
              <span style="color:#c3d4f0">c${cluster}</span>
              <span style="opacity:.65;font-size:10px">${count} maps</span>
            </div>`;
          }).join('');
          searchClustersPanelEl.innerHTML = hdr + (collapsed ? '' : `<div style="max-height:220px;overflow-y:auto">${rows}</div>`);
          document.getElementById('scCollapseBtn').addEventListener('click', () => {
            searchClustersPanelEl.dataset.collapsed = collapsed ? '0' : '1';
            renderSearchClustersPanel();
          });
          searchClustersPanelEl.querySelectorAll('.sc-item').forEach(el => {
            const c = Number(el.dataset.cluster);
            el.addEventListener('mouseenter', () => { hoveredSearchCluster = c; scheduleRender(); });
            el.addEventListener('mouseleave', () => { hoveredSearchCluster = null; scheduleRender(); });
            el.addEventListener('click', () => {
              selectedCluster = c;
              render();
              renderClusterList();
              renderBadge();
              renderSearchClustersPanel();
            });
          });
        }
        searchBtnEl.addEventListener('click', runSearch);
        searchInputEl.addEventListener('keydown', ev => { if (ev.key === 'Enter') runSearch(); });
        // Switch placeholder text when search type changes
        searchTypeEl.addEventListener('change', () => {
          const _m = searchTypeEl.value;
          searchInputEl.placeholder = _m === 'mapper' ? 'e.g. RLC'
            : _m === 'top_scores' ? 'username or user ID'
            : 'e.g. 1234567';
        });
        clusterSortEl.addEventListener('change', () => { renderClusterList(); });
        document.getElementById('clusterGoBtn').addEventListener('click', () => goToCluster(document.getElementById('clusterGoInput').value));
        document.getElementById('clusterGoInput').addEventListener('keydown', ev => { if (ev.key === 'Enter') goToCluster(ev.target.value); });
        labeledListEl.addEventListener('click', ev => {
          const el = ev.target && ev.target.closest ? ev.target.closest('[data-map-id]') : null;
          if (!el) return;
          const mid = el.getAttribute('data-map-id');
          if (!mid) return;
          const idx = lookupMapIndex(mid);
          if (Number.isInteger(idx)) {
            // Toggle selection — same behaviour as clicking the point on the canvas.
            if (selectedMapSet.has(idx)) { selectedMapSet.delete(idx); } else { selectedMapSet.add(idx); }
            if (searchClusterData.length === 0) {
              if (selectedMapSet.size === 0) {
                // Keep current cluster highlighted even when no map is pinned.
                searchClusterSet = selectedCluster !== null ? new Set([selectedCluster]) : new Set();
              } else {
                searchClusterSet = new Set([...selectedMapSet].map(i => Number(clusterArr[i])));
                selectedCluster = searchClusterSet.size === 1 ? [...searchClusterSet][0] : null;
              }
            }
            render(); renderClusterList(); renderSelectionPanel();
          } else {
            // Map not in dataset — fall back to osu link.
            window.open(`https://osu.ppy.sh/beatmaps/${mid}`, '_blank');
          }
        });
        window.addEventListener('keydown', ev => {
          if (ev.key === 'Escape' && (selectedMapSet.size > 0 || selectedCluster !== null || searchClusterSet.size > 0)) {
            clearAllState();
            render(); renderClusterList(); renderSelectionPanel(); renderSearchClustersPanel();
          }
        });
        rankedModeEl.value = rankedMode;     // sync select to JS default
        isReady = true;
        syncViewModePills();
        render();
        // TextLayer asserts if created before deck.gl has a WebGL device.
        requestAnimationFrame(() => {
          allowLabelLayer = true;
          if (showLabels) render();
        });
      } catch (e) {
        statusEl.textContent = `Failed to load data: ${String(e)}`;
      }
    })();
  </script>
</body>
</html>
